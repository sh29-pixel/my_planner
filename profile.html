<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="profile_page_title">حسابي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 data-key="profile_header">حسابي</h1>

  <nav>
    <a href="index.html" data-key="nav_home">الرئيسية</a>
    <a href="tasks.html" data-key="nav_tasks">المهام</a>
    <a href="appointments.html" data-key="nav_appointments">المواعيد</a>
    <a href="about.html" data-key="nav_about">عنّا</a>
    <button onclick="logout()" data-key="logout">تسجيل خروج</button>
    <button class="lang-btn" onclick="toggleLang()">AR / EN</button>
<button class="dark-btn" onclick="toggleDarkMode()">🌙</button>
  </nav>
</header>

<main class="container center">
  <div class="card profile-card">
    <h2 data-key="profile_header">حسابي</h2>

    <p>
      <strong data-key="name">الاسم:</strong>
      <span id="userName"></span>
    </p>

    <p>
      <strong data-key="email">البريد الإلكتروني:</strong>
      <span id="userEmail"></span>
    </p>
  </div>
</main>

<script src="auth.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("user"));
const loggedIn = localStorage.getItem("loggedIn");

if (!user || loggedIn !== "true") {
  window.location.href = "login.html";
} else {
  document.getElementById("userName").textContent = user.name || "—";
  document.getElementById("userEmail").textContent = user.email || "—";
}
</script>
<script src="script.js"></script>

</body>
</html>
